# 通过 npm Trusted Publishing（OIDC）发布：无需 token、无需 2FA 验证码
# 前置（一次性，在 npm 网站配置）：
#   包页面 → Settings → Trusted Publisher → GitHub Actions
#   Organization or user: miaoxintechnology
#   Repository:            dsh-deepseek-cost
#   Workflow filename:     publish.yml
#   Environment:           （留空）
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing + provenance 必需
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1
      - name: 升级 npm
        run: npm install -g npm@latest

      # 该包依赖 zod，prepublishOnly 跑测试需要它
      - name: 安装依赖
        run: npm install --no-audit --no-fund

      # 幂等保护：版本已存在于 npm 时跳过发布（避免重复发布报 403 并向账号发失败邮件）
      - name: 检查版本是否已发布
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "dsh-deepseek-cost@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-deepseek-cost@$VERSION 已存在于 npm，跳过发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly 会自动跑测试（fold.test.js），保证发布产物与源码一致
      - name: 发布到 npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance --access public
